include ./kitty-themes/themes/IR-Black.conf

# Font Size (Standard + Numpad)
map ctrl+equal       increase_font_size
map ctrl+plus        increase_font_size
map ctrl+kp_add      increase_font_size

map ctrl+minus       decrease_font_size
map ctrl+kp_subtract decrease_font_size

map ctrl+0           restore_font_size
map ctrl+kp_0        restore_font_size

# Toggle fullscreen mode with F11
map f11 toggle_fullscreen

# Tabs
map ctrl+t         new_tab

# Switch tabs with Alt + Arrow keys
map alt+left  previous_tab
map alt+right next_tab

# Go to first and last tabs
map alt+up    goto_tab 1
map alt+down  goto_tab -1

# Close tab with Alt + Q
map alt+q close_tab

# Scrolling (Line by line)
map shift+up        scroll_line_up
map shift+down      scroll_line_down

# Scrolling (Page by page)
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down

# Background transparency (0.0 = completely invisible, 1.0 = solid)
background_opacity 0.75

# Allow changing transparency dynamically with keybindings
dynamic_background_opacity yes

# Dim unfocused windows slightly for visual contrast
inactive_text_alpha 0.8

# Font settings (adjust font family to your preference)
font_family      family="Hack Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# Set tab bar font size (e.g., smaller than main text)
tab_font_size 12.0

# Limit max title width to 20 characters (truncates longer text)
tab_title_template " {index}: {title[:20]} "

# Or pad to a minimum width (e.g., minimum 15 characters, centered/left-aligned)
tab_title_template " {index}: {title:15.15} "

# Position: top or bottom
tab_bar_edge top

# Bar layout style: powerline, slant, fade, separator, or hidden
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# Tab bar margin spacing around the bar itself
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

# Enable ligatures
disable_ligatures never

# Window Padding (adds breathable spacing around text)
window_padding_width 3

# Cursor Styling
cursor_shape           block
cursor_shape_unfocused block
cursor_blink_interval 1
cursor_stop_blinking_after 15.0

# Hide mouse cursor when typing
mouse_hide_wait 3.0

# Add vertical spacing between lines (e.g., 2px or 110%)
adjust_line_height 2

# Url processing
url_style               straight

# Scale underline thickness (e.g., 150% or 200% of standard font thickness)
# modify_font underline_thickness 125%

detect_urls             yes
open_url_with           default
# show_hyperlink_targets  yes

# Enabled layouts (Tall, Grid, Fat, Split)
enabled_layouts splits,stack,tall,fat

# Window splitting keybindings
map ctrl+shift+e launch --location=vsplit
map ctrl+shift+o launch --location=hsplit

# Cycle through active layouts
map ctrl+shift+l next_layout

# Move focus between split windows using Alt + Shift + Arrow keys
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Rotate window layout (swap split direction)
map ctrl+shift+r layout_action rotate

# Resize splits dynamically with Alt + Shift + H/J/K/L
map ctrl+shift+l resize_window narrower 1
map ctrl+shift+h resize_window wider 1
map ctrl+shift+j resize_window taller 1
map ctrl+shift+k resize_window shorter 1

# Visual separation for active split borders
active_border_color   #c0c0c0
inactive_border_color #444444

window_margin_width   0
window_border_width   1.0pt

# Disable audio bell completely
# enable_audio_bell no

# Enable visual flash on bell (0.0s disables flash)
# visual_bell_duration 0.1
# visual_bell_color    #111111

# Enable the audio bell
enable_audio_bell yes

# Path to your custom sound file (.wav or .ogg work best)
bell_path ~/.config/kitty/sound/win11_ding.wav

# Enable cursor trail (0.1 to 0.5 works best)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Sync rendering to your monitor's refresh rate to prevent screen tearing
sync_to_monitor yes

# Maximize frame rate responsiveness (lower delay = faster text throughput)
repaint_delay   8
input_delay     2
