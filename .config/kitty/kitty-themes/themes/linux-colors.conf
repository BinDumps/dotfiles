# vim:ft=kitty
#: This is a template that can be used to create new kitty themes.
#: Theme files should start with a metadata block consisting of
#: lines beginning with ##. All metadata fields are optional.

## name: Linux Colors
## author: ext
## license: MIT
## blurb: Classic VGA/Linux console color palette with high contrast bright colors.
##

#: All the settings below are colors, which you can choose to modify, or use the
#: defaults. You can also add non-color based settings if needed but note that
#: these will not work with using kitty @ set-colors with this theme. For a
#: reference on what these settings do see https://sw.kovidgoyal.net/kitty/conf/

#: The basic colors

foreground                      #f5f5f5
background                      #000000
selection_foreground            #000000
selection_background            #b2b2b2


#: Cursor colors

cursor                          #f5f5f5
cursor_text_color               #000000


#: URL underline color when hovering with mouse

url_color                       #54ffff


#: kitty window border colors and terminal bell colors

# active_border_color             #18b218
# inactive_border_color           #686868
# bell_border_color               #ff5454
# visual_bell_color               none


#: OS Window titlebar colors

wayland_titlebar_color          system
macos_titlebar_color            system


#: Tab bar colors

# active_tab_foreground           #000000
# active_tab_background           #f5f5f5
# inactive_tab_foreground         #b2b2b2
# inactive_tab_background         #686868
# tab_bar_background              none
# tab_bar_margin_color            none


#: Colors for marks (marked text in the terminal)

# mark1_foreground #000000
# mark1_background #54ffff
# mark2_foreground #000000
# mark2_background #ffff54
# mark3_foreground #000000
# mark3_background #ff54ff


#: The basic 16 colors

#: black
color0 #000000
color8 #686868

#: red
color1 #b21818
color9 #ff5454

#: green
color2  #18b218
color10 #54ff54

#: yellow
color3  #b26818
color11 #ffff54

#: blue
color4  #1818b2
color12 #5454ff

#: magenta
color5  #b218b2
color13 #ff54ff

#: cyan
color6  #18b2b2
color14 #54ffff

#: white
color7  #b2b2b2
color15 #ffffff


#: You can set the remaining 240 colors as color16 to color255.
