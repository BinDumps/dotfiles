# Font configuration
font_family      Hack Nerd Font Mono Regular
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        15.0

# Window padding and opacity
window_padding_width 12
background_opacity   0.75
background_blur      1

# Primary colors
background #000000
foreground #ffffff

# Cursor colors
cursor            #ffffff
cursor_text_color #000000

# Selection colors
selection_background #545454
selection_foreground #ffffff

# The 16 terminal colors

# Black (Normal / Bright)
color0 #000000
color8 #777777

# Red
color1 #ff4444
color9 #ff6666

# Green
color2  #44ff44
color10 #66ff66

# Yellow
color3  #ffaa22
color11 #ffff66

# Blue
color4  #5577ff
color12 #6688ff

# Magenta
color5  #ff55ff
color13 #ff88ff

# Cyan
color6  #22dddd
color14 #66ffff

# White
color7  #e0e0e0
color15 #ffffff

# Keybindings
map f11 toggle_fullscreen
