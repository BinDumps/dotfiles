# vim:ft=kitty
#: This is a true Linux TTY / VGA text-mode color scheme for Kitty.

## name: TTY
## author: Linux Console Palette
## license: MIT
## blurb: Authentic Linux virtual console / VGA text-mode 16-color palette.
##

#: The basic colors

foreground                      #aaaaaa
background                      #000000
selection_foreground            #000000
selection_background            #aaaaaa


#: Cursor colors

cursor                          #aaaaaa
cursor_text_color               #000000


#: URL underline color when hovering with mouse

url_color                       #55ffff


#: kitty window border colors and terminal bell colors

# active_border_color             #00aa00
# inactive_border_color           #555555
# bell_border_color               #ff5555
# visual_bell_color               none


#: OS Window titlebar colors

wayland_titlebar_color          system
macos_titlebar_color            system


#: Tab bar colors

# active_tab_foreground           #000000
# active_tab_background           #aaaaaa
# inactive_tab_foreground         #555555
# inactive_tab_background         #000000
# tab_bar_background              none
# tab_bar_margin_color            none


#: Colors for marks (marked text in the terminal)

# mark1_foreground #000000
# mark1_background #55ffff
# mark2_foreground #000000
# mark2_background #ffff55
# mark3_foreground #000000
# mark3_background #ff55ff


#: The basic 16 colors (Standard Linux / VGA Console Palette)

#: black
color0 #000000
color8 #555555

#: red
color1 #aa0000
color9 #ff5555

#: green
color2  #00aa00
color10 #55ff55

#: yellow (Classic VGA Brown/Yellow)
color3  #aa5500
color11 #ffff55

#: blue
color4  #0000aa
color12 #5555ff

#: magenta
color5  #aa00aa
color13 #ff55ff

#: cyan
color6  #00aaaa
color14 #55ffff

#: white
color7  #aaaaaa
color15 #ffffff
