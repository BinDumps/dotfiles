# Font configuration
font_family      Hack Nerd Font Mono Regular
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        15.0

# Window padding and opacity
window_padding_width 12
background_opacity   0.82
background_blur      1

# Primary colors
background #0b0a12
foreground #e2d9f3

# Cursor colors
cursor            #d0bfff
cursor_text_color #0b0a12

# Selection colors
selection_background #3b2d54
selection_foreground #ffffff

# The 16 terminal colors

# Black (Normal / Bright)
color0 #181524
color8 #524868

# Red
color1 #ff5577
color9 #ff6e8b

# Green
color2  #50fa7b
color10 #69ff94

# Yellow
color3  #f1fa8c
color11 #ffffa5

# Blue
color4  #aabaef
color12 #c3d1ff

# Magenta
color5  #bd93f9
color13 #d0bfff

# Cyan
color6  #8be9fd
color14 #a4f0ff

# White
color7  #d8cfea
color15 #ffffff

# Keybindings
map f11 toggle_fullscreen
