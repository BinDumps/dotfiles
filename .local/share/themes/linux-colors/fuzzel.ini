[main]
font=Monospace:size=11
prompt="❯ "
icon-theme=hicolor
fields=filename,name,generic,exec,keywords
terminal=alacritty -e
lines=20
width=60
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.5

[border]
width=2
radius=8

[colors]
# Format: RRGGBBAA (Hex with Alpha)
background=121212d9
text=f0f0f0ff
prompt=ffaa00ff
placeholder=666666ff
input=ffffffff
match=ffaa00ff
selection=333333ff
selection-text=ffaa00ff
selection-match=ffc83bff
border=ffaa00ff
