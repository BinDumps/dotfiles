[main]
font=Monospace:size=11
prompt="❯ "
icon-theme=hicolor
fields=filename,name,generic,exec,keywords
terminal=alacritty -e
lines=20
width=60
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.5

[border]
width=2
radius=8

[colors]
# Format: RRGGBBAA (Hex with Alpha)
# 85% opacity background (d9 = ~85%)
background=000000d9
text=ffffffff
prompt=ff55ffff
placeholder=777777ff
input=ffffffff
match=ffaa22ff
selection=5577ff40
selection-text=ffffffff
selection-match=ffff66ff
border=88c0d0ff
