# Background
background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# General Settings
general {
    ignore_empty_input = true
    grace = 0
}

# Time Widget (Windows 11 Large Clock)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = Segoe UI Variable Display

    # Drop shadow for readability
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_boost = 1.2

    position = 0, -120
    halign = center
    valign = top
}

# Date Widget
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %e")"
    color = rgba(240, 240, 240, 0.95)
    font_size = 20
    font_family = Segoe UI Variable Text

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)

    position = 0, -280
    halign = center
    valign = top
}

# Password Input Field (Windows 11 Pill Style)
input-field {
    monitor =
    size = 280, 45
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    rounding = 25

    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">PIN or Password</span>

    font_color = rgb(255, 255, 255)
    inner_color = rgba(30, 30, 30, 0.5)
    outer_color = rgba(255, 255, 255, 0.2)
    check_color = rgba(0, 120, 212, 0.8) # Win11 Accent Blue
    fail_color = rgba(232, 17, 35, 0.8)   # Win11 Error Red

    position = 0, -60
    halign = center
    valign = center
}

# Keyboard Layout Indicator (Bottom Right)
label {
    monitor =
    text = $LAYOUT
    color = rgba(220, 220, 220, 0.8)
    font_size = 12
    font_family = Segoe UI

    position = -30, 30
    halign = right
    valign = bottom
}
