background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
    blur_passes = 2
    blur_size = 8
}

general {
    ignore_empty_input = true
    grace = 0
}

# Time Widget
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

# Date Widget
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(192, 192, 200, 1.0)
    font_size = 18
    font_family = monospace
    position = 0, 10
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = Layout: $LAYOUT
    color = rgba(200, 200, 200, 1.0)
    font_size = 14
    font_family = monospace
    
    # Position settings for bottom middle
    halign = center
    valign = bottom
    position = 0, 30
}

# Password Field
input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    fade_on_empty = false
    font_color = rgb(255, 255, 255)
    inner_color = rgba(0, 0, 0, 0.5)
    outer_color = rgb(192, 192, 200)
    position = 0, -80
    halign = center
    valign = center
}
