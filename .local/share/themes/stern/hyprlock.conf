background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
    blur_passes = 2
    blur_size = 8
}

general {
    ignore_empty_input = true
    grace = 0
}

# Time Widget
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}

# Date Widget
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(192, 192, 200, 1.0)
    font_size = 18
    font_family = monospace
    position = 0, 10
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = Layout: $LAYOUT
    color = rgba(200, 200, 200, 1.0)
    font_size = 14
    font_family = monospace
    
    # Position settings for bottom middle
    halign = center
    valign = bottom
    position = 0, 30
}

# Password Field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    fade_on_empty = false
    placeholder_text = <span font="Hack Nerd Font Mono 12" foreground="##c0c0c0">Password</span>
    # Custom text for failure
    fail_text = <span font="Hack Nerd Font Mono 11" foreground="##ff3b3b"><b>FAIL</b> ($ATTEMPTS)</span>
    fail_transition = 200
    font_color = rgb(255, 255, 255)
    inner_color = rgba(0, 0, 0, 0.5)
    outer_color = rgb(190, 190, 200)
    check_color = rgba(150, 150, 255, 1.0)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $FAIL
    color = rgba(204, 34, 34, 1.0)
    font_size = 14
    font_family = Hack Nerd Font Mono
    position = 0, -140
    halign = center
    valign = center
}
