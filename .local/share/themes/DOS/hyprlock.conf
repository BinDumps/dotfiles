# Background
background {
    monitor =
    path = ~/.config/hypr/lockscreen.jpg
}

# General Settings
general {
    ignore_empty_input = true
    grace = 0
    disable_loading_bar = true
}

# Time Widget (Large Industrial Monospace Clock)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = PxPlus IBM VGA8

    # Sharp dark drop shadow
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.9)
    shadow_boost = 1.5

    position = 0, -120
    halign = center
    valign = top
}

# Date Widget
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %e")"
    color = rgba(209, 199, 199, 0.90) # Subdued Off-White (#d1c7c7)
    font_size = 18
    font_family = PxPlus IBM VGA8
    position = 0, -250
    halign = center
    valign = top
}

# Password Input Field (Sharp Industrial Frame)
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.30
    dots_center = true
    rounding = 1 # Sharp boxy aesthetic instead of pills

    fade_on_empty = false
    placeholder_text = <span font="PxPlus IBM VGA8 13" foreground="##c0c0c0">PASSWORD</span>

    # Custom text for failure
    fail_text = <span font="PxPlus IBM VGA8 13" foreground="##ff2b2b"><b>ACCESS DENIED</b> ($ATTEMPTS)</span>
    fail_transition = 200

    font_color = rgb(255, 255, 255)
    inner_color = rgba(10, 10, 10, 0.85)        # Pitch Black
    outer_color = rgba(122, 122, 122, 0.80)     # Dark Gray Border
    check_color = rgba(200, 200, 200, 1.0)      # Bright Gray Check
    fail_color = rgba(255, 30, 30, 1.0)         # Blood Red Fail

    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    # Error message display
    text = $FAIL
    color = rgba(204, 34, 34, 1.0)
    font_size = 14
    font_family = PxPlus IBM VGA8
    position = 0, -200
    halign = center
    valign = center
}

# Keyboard Layout Indicator (Bottom Right)
label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(1, 1, 1, 1.0)
    font_size = 14
    font_family = PxPlus IBM VGA8
    position = -25, 8
    halign = right
    valign = bottom
}
