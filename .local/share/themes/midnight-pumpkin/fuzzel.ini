[main]
font=Monospace:size=11
prompt="❯ "
icon-theme=hicolor
fields=filename,name,generic,exec,keywords
terminal=alacritty -e
lines=20
width=60
horizontal-pad=20
vertical-pad=12
inner-pad=8
image-size-ratio=0.5

[border]
width=2
radius=8

[colors]
# Format: RRGGBBAA (Hex with Alpha)
# Dark obsidian background matching the waybar pills (#121013) with ~85% opacity
background=121013d9
text=fce8e6ff
prompt=ff7518ff
placeholder=5a4f56ff
input=fce8e6ff
match=ff9f43ff
selection=ff751833
selection-text=fce8e6ff
selection-match=ffbc75ff
border=ff7518ff
